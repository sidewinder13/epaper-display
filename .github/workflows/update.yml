name: Update E-Paper Display Image

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Pillow Library
        run: pip install Pillow

      - name: Run Python Bit-Packer
        run: python script.py

      - name: Commit and Push All Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          # ✅ ΔΙΟΡΘΩΘΗΚΕ: Ανεβάζει live και το image.bin και το preview.png μαζί
          git add image.bin preview.png
          git commit -m "Automated update of epaper images and preview" || echo "No changes to commit"
          git push

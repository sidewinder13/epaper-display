name: Update E-Paper Display Image

on:
  repository_dispatch:
    types: [esp32_ping]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Pillow Library
        run: pip install Pillow

      - name: Run Python Bit-Packer
        run: python script.py

      - name: Commit and Push All Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add image.bin preview.png
          git commit -m "Live image update triggered by ESP32 hardware ping" || echo "No changes to commit"
          git push

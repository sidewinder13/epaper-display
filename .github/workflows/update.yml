name: Update E-Paper Display Image

on:
  repository_dispatch:
    types: [esp32_ping]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Pillow Library
        run: pip install Pillow

      - name: Run Python Bit-Packer
        run: python script.py

         # 4. Commit και Push (Μόνο αν υπάρχει αλλαγή στο image.bin)
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Ο έλεγχος git diff βλέπει αν άλλαξε το image.bin
        if git diff --quiet image.bin; then
          print "🛑 Καμία αλλαγή στο image.bin. Παράκαμψη Commit."
        else
          git add image.bin
          git commit -m "Live image update triggered by ESP32 hardware ping"
          git push
        fi


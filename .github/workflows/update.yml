name: Deploy Image

on:
  repository_dispatch:
    types: [esp32_ping]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests Pillow

    - name: Run script
      run: python script.py

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if git diff --quiet image.bin; then
          echo "No changes detected in image.bin"
        else
          git add image.bin
          git commit -m "Live image update triggered by ESP32 hardware ping"
          git push
        fi
